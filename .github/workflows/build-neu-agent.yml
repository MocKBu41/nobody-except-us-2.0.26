name: Build NEU Agent

on:
  workflow_dispatch:
  push:
    paths:
      - 'NEU_AGENT/**'
      - '.github/workflows/build-neu-agent.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish win-x64 single EXE
        shell: pwsh
        run: |
          dotnet publish .\NEU_AGENT\NEUAgent\NEUAgent.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o .\dist

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path .\dist\NEU-Agent.exe, .\NEU_AGENT\README.md -DestinationPath .\NEU-Agent-win-x64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEU-Agent-win-x64
          path: NEU-Agent-win-x64.zip
