<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEU BOT v1.25 — тактическая карта</title>
<style>
:root{color-scheme:dark;--bg:#0d1117;--panel:#161b22;--border:#30363d;--text:#e6edf3;--muted:#8b949e;--blue:#58a6ff;--red:#ff6b6b;--green:#56d364;--yellow:#e3b341}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:13px Segoe UI,Arial,sans-serif}header{height:58px;display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--panel)}h1{font-size:17px;margin:0 12px 0 0}button,input{background:#21262d;color:var(--text);border:1px solid var(--border);border-radius:6px;padding:7px 10px}.layout{height:calc(100vh - 58px);display:grid;grid-template-columns:330px 1fr 330px}.side{padding:10px;overflow:auto;background:var(--panel)}.left{border-right:1px solid var(--border)}.right{border-left:1px solid var(--border)}#mapWrap{position:relative;overflow:hidden}canvas{width:100%;height:100%;display:block;background:#090d12}.box{border:1px solid var(--border);border-radius:7px;padding:9px;margin-bottom:9px;background:#0d1117}.title{font-weight:700;margin-bottom:6px}.muted{color:var(--muted);font-size:12px}.ok{color:var(--green)}.warn{color:var(--yellow)}.bad{color:var(--red)}label{display:block;margin:5px 0}.group,.squad{padding:7px;border-bottom:1px solid #252b33}.pill{display:inline-block;padding:2px 5px;border:1px solid var(--border);border-radius:8px;margin-left:4px;font-size:11px}.legend{display:grid;grid-template-columns:12px 1fr;gap:5px 7px;align-items:center}.dot{width:10px;height:10px;border-radius:50%}#events{height:180px;overflow:auto;font:11px Consolas,monospace;white-space:pre-wrap}.tip{position:absolute;display:none;pointer-events:none;background:#111c;border:1px solid #59636e;border-radius:5px;padding:6px;z-index:5}.toolbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap}input[type=range]{width:100%;padding:0}
</style></head><body>
<header><h1>NEU BOT v1.25 — карта решений и движения</h1><div class="toolbar"><button id="open">Открыть JSON / JSONL</button><button id="live">Live-файл</button><button id="last">Последний кадр</button><span id="status" class="muted">Файл не загружен</span><input id="file" type="file" accept=".json,.jsonl,.txt,application/json,text/plain" hidden></div></header>
<div class="layout"><aside class="side left">
<div class="box"><div class="title">Отображение</div><label><input id="routes" type="checkbox" checked> маршруты squad через 30 м</label><label><input id="attack" type="checkbox" checked> направления атак</label><label><input id="front" type="checkbox" checked> фронт пехоты 5–6 м</label><label><input id="observed" type="checkbox" checked> положение, которое видит бот</label><label><input id="labels" type="checkbox" checked> подписи</label></div>
<div class="box"><div class="title">Легенда</div><div class="legend"><span class="dot" style="background:#56d364"></span><span>наша точка</span><span class="dot" style="background:#ff6b6b"></span><span>точка противника</span><span class="dot" style="background:#e3b341"></span><span>нейтральная точка</span><span class="dot" style="background:#fff"></span><span>SPAWN</span><span class="dot" style="background:#58a6ff"></span><span>отряд / маршрут</span></div></div>
<div class="box"><div class="title">Состояние карты</div><div id="mapInfo" class="muted">—</div></div>
<div class="box"><div class="title">Время</div><input id="timeline" type="range" min="0" max="0" value="0"><div id="timeText" class="muted">0</div></div>
</aside><main id="mapWrap"><canvas id="map"></canvas><div id="tip" class="tip"></div></main><aside class="side right"><div class="box"><div class="title">Группы атаки</div><div id="groups"></div></div><div class="box"><div class="title">Отряды</div><div id="squads"></div></div><div class="box"><div class="title">События</div><div id="events"></div></div></aside></div>
<script>
const $=s=>document.querySelector(s),cv=$('#map'),ctx=cv.getContext('2d');let snapshots=[],events=[],idx=0,handle=null,timer=null,view=null;const colors=['#58a6ff','#d2a8ff','#79c0ff','#ffa657','#7ee787','#ff7b72','#a5d6ff','#f2cc60'];
function addRecord(j){if(!j||typeof j!=='object')return;if(j.type==='snapshot')snapshots.push(j);else if(j.type==='event')events.push(j);else if(Array.isArray(j.snapshots)||Array.isArray(j.events)){for(const s of j.snapshots||[])addRecord(s.type?s:{...s,type:'snapshot'});for(const e of j.events||[])addRecord(e.type?e:{...e,type:'event'})}}
function parse(text){snapshots=[];events=[];const src=text.trim();if(!src){render();return}let parsed=false;try{const root=JSON.parse(src);parsed=true;if(Array.isArray(root)){for(const j of root)addRecord(j)}else addRecord(root)}catch(e){}if(!parsed){for(const line of src.split(/\r?\n/)){if(!line.trim())continue;try{addRecord(JSON.parse(line))}catch(e){}}}snapshots.sort((a,b)=>(a.time||0)-(b.time||0));events.sort((a,b)=>(a.time||0)-(b.time||0));idx=Math.max(0,snapshots.length-1);$('#timeline').max=Math.max(0,snapshots.length-1);$('#timeline').value=idx;if(!snapshots.length){$('#status').textContent='Файл прочитан, но snapshot не найден';$('#status').className='warn'}render();}
async function readHandle(){if(!handle)return;const f=await handle.getFile();parse(await f.text())}
$('#file').onchange=async e=>{const f=e.target.files&&e.target.files[0];if(!f)return;$('#status').textContent='Читаю: '+f.name;try{parse(await f.text());if(snapshots.length){$('#status').textContent='Загружен: '+f.name+' · кадров '+snapshots.length;$('#status').className='ok'}}catch(err){$('#status').textContent='Ошибка чтения: '+err.message;$('#status').className='bad'}e.target.value=''};
$('#open').onclick=()=>$('#file').click();$('#last').onclick=()=>{idx=Math.max(0,snapshots.length-1);$('#timeline').value=idx;render()};
$('#live').onclick=async()=>{if(!window.showOpenFilePicker){$('#status').textContent='Live-файл не поддерживается браузером';return}try{[handle]=await showOpenFilePicker({types:[{description:'NEU telemetry JSON / JSONL',accept:{'application/json':['.json'],'text/plain':['.jsonl','.txt']}}],multiple:false});await readHandle();clearInterval(timer);timer=setInterval(readHandle,1000);$('#status').textContent='LIVE: '+handle.name}catch(e){if(e.name!=='AbortError'){$('#status').textContent='Ошибка выбора файла: '+e.message;$('#status').className='bad'}}};
$('#timeline').oninput=e=>{idx=+e.target.value;render()};['routes','attack','front','observed','labels'].forEach(id=>$('#'+id).onchange=draw);
function snap(){return snapshots[idx]||null}function valid(p){return p&&Number.isFinite(p.x)&&Number.isFinite(p.y)}function allPoints(s){let a=[];if(!s)return a;if(valid(s.spawn))a.push(s.spawn);for(const f of s.flags||[])if(valid(f))a.push(f);for(const q of s.squads||[]){if(valid(q.observed))a.push(q.observed);if(valid(q.lastCommand))a.push(q.lastCommand);const p=q.plan;if(p){if(valid(p.spawn))a.push(p.spawn);if(valid(p.targetPoint))a.push(p.targetPoint);for(const x of p.points||[])if(valid(x))a.push(x);for(const x of p.carrierPoints||[])if(valid(x))a.push(x);for(const l of p.lanes||[]){if(valid(l.stage))a.push(l.stage);if(valid(l.goal))a.push(l.goal)}}}return a}
function fit(s){const a=allPoints(s);if(!a.length){view={minX:-100,maxX:100,minY:-100,maxY:100};return}let xs=a.map(p=>p.x),ys=a.map(p=>p.y),minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);let px=Math.max(80,(maxX-minX)*.07),py=Math.max(80,(maxY-minY)*.07);view={minX:minX-px,maxX:maxX+px,minY:minY-py,maxY:maxY+py}}
function tr(p){const r=cv.getBoundingClientRect(),dx=view.maxX-view.minX||1,dy=view.maxY-view.minY||1,s=Math.min(r.width/dx,r.height/dy)*.94,ox=(r.width-dx*s)/2,oy=(r.height-dy*s)/2;return{x:ox+(p.x-view.minX)*s,y:r.height-(oy+(p.y-view.minY)*s)}}
function resize(){let r=cv.getBoundingClientRect(),d=devicePixelRatio||1;cv.width=Math.floor(r.width*d);cv.height=Math.floor(r.height*d);ctx.setTransform(d,0,0,d,0,0);draw()}new ResizeObserver(resize).observe($('#mapWrap'));
function line(a,b,c,w=1,dash=[]){if(!valid(a)||!valid(b))return;let A=tr(a),B=tr(b);ctx.strokeStyle=c;ctx.lineWidth=w;ctx.setLineDash(dash);ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(B.x,B.y);ctx.stroke();ctx.setLineDash([])}
function arrow(a,b,c,w=2){if(!valid(a)||!valid(b))return;line(a,b,c,w);let A=tr(a),B=tr(b),ang=Math.atan2(B.y-A.y,B.x-A.x),l=8;ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(B.x,B.y);ctx.lineTo(B.x-Math.cos(ang-.5)*l,B.y-Math.sin(ang-.5)*l);ctx.lineTo(B.x-Math.cos(ang+.5)*l,B.y-Math.sin(ang+.5)*l);ctx.closePath();ctx.fill()}
function mark(p,c,label,r=5,shape='circle'){if(!valid(p))return;let P=tr(p);ctx.fillStyle=c;ctx.strokeStyle='#05080c';ctx.lineWidth=1.5;ctx.beginPath();if(shape==='square')ctx.rect(P.x-r,P.y-r,r*2,r*2);else ctx.arc(P.x,P.y,r,0,Math.PI*2);ctx.fill();ctx.stroke();if($('#labels').checked&&label){ctx.fillStyle='#e6edf3';ctx.font='11px Segoe UI';ctx.fillText(label,P.x+7,P.y-7)}}
function grid(){let r=cv.getBoundingClientRect();ctx.clearRect(0,0,r.width,r.height);if(!view)return;let span=Math.max(view.maxX-view.minX,view.maxY-view.minY),step=span>6000?1000:span>3000?500:span>1500?250:100;ctx.strokeStyle='#171d24';ctx.fillStyle='#55606d';ctx.font='10px Segoe UI';for(let x=Math.floor(view.minX/step)*step;x<=view.maxX;x+=step){line({x,y:view.minY},{x,y:view.maxY},'#171d24');let P=tr({x,y:view.minY});ctx.fillText(x,P.x+2,r.height-4)}for(let y=Math.floor(view.minY/step)*step;y<=view.maxY;y+=step){line({x:view.minX,y},{x:view.maxX,y},'#171d24')}}
function draw(){const s=snap();grid();if(!s)return;for(const f of s.flags||[]){const c=f.owner==='bot'?'#56d364':f.owner==='enemy'?'#ff6b6b':'#e3b341';mark(f,c,f.name,7)}if(valid(s.spawn))mark(s.spawn,'#fff','SPAWN',7,'square');
 if($('#attack').checked)for(const g of s.groups||[]){let from=g.approach||g.rally||s.spawn,to=(s.flags||[]).find(f=>f.name===g.target);if(valid(from)&&valid(to))arrow(from,to,colors[(g.id||0)%colors.length],3)}
 for(const q of s.squads||[]){const c=colors[(Number(q.groupId)||Number(q.id)||0)%colors.length],p=q.plan;if($('#routes').checked&&p){let arr=[p.spawn,...(p.points||[])].filter(valid);for(let i=1;i<arr.length;i++)arrow(arr[i-1],arr[i],c,1.6);for(let i=1;i<arr.length;i++)mark(arr[i],c,'',2);let ca=[p.spawn,...(p.carrierPoints||[])].filter(valid);for(let i=1;i<ca.length;i++)line(ca[i-1],ca[i],'#a5d6ff',1,[5,4]);if($('#front').checked)for(const lane of p.lanes||[]){if(valid(lane.stage)&&valid(lane.goal))arrow(lane.stage,lane.goal,c,.8)}}if($('#observed').checked&&valid(q.observed))mark(q.observed,'#fff','S'+q.id+' '+q.role,6);else if(valid(q.lastCommand))mark(q.lastCommand,c,'S'+q.id+' '+q.role+' [приказ]',5)} }
}
function render(){const s=snap();if(!s){fit(null);draw();if(!snapshots.length&&$('#status').textContent==='Файл не загружен')$('#status').textContent='Нет snapshot в файле';return}fit(s);$('#timeline').value=idx;$('#timeText').textContent='t='+s.time+' сек · кадр '+(idx+1)+'/'+snapshots.length;$('#status').textContent='t='+s.time+' · '+(s.map||'unknown');$('#status').className=s.mapLoaded?'ok':'warn';$('#mapInfo').innerHTML=`Карта: <b>${s.map||'unknown'}</b><br>geometry: <b>${s.mapLoaded?'OK':'НЕТ КООРДИНАТ'}</b><br>Точки: свои ${s.flagsMine||0} / враг ${s.flagsEnemy||0} / neutral ${s.flagsNeutral||0}<br>Squad: ${(s.squads||[]).length}`;
 $('#groups').innerHTML=(s.groups||[]).map(g=>`<div class="group"><b>G${g.id}</b><span class="pill">${g.phase}</span><br>цель: <b>${g.target||'—'}</b> · волна ${g.wave||0}<br><span class="muted">I:${g.infantryCount||0} T:${g.tankCount||0}</span></div>`).join('')||'<span class="muted">нет групп</span>';
 $('#squads').innerHTML=(s.squads||[]).map(q=>`<div class="squad"><b>S${q.id}</b> <span class="pill">${q.role}</span> G${q.groupId??'—'}<br><span class="muted">${q.observed?'позиция подтверждена ботом':q.lastCommand?'показан последний приказ':'нет координат'}${q.plan?' · route '+(q.plan.points||[]).length+' т.':''}</span></div>`).join('');
 $('#events').textContent=events.filter(e=>e.time<=s.time).slice(-80).map(e=>`[${e.time}] ${e.message}`).join('\n');$('#events').scrollTop=$('#events').scrollHeight;draw()}
resize();
</script></body></html>
