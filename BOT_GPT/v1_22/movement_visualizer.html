<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEU BOT v1.22 — визуализация маршрутов</title>
<style>
:root{color-scheme:dark;--bg:#11151a;--panel:#1b222a;--line:#2d3946;--text:#e8eef6;--muted:#9fb0c3;--accent:#6db6ff;--danger:#ff7a7a}
*{box-sizing:border-box}body{margin:0;font:14px/1.35 Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}
header{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
h1{font-size:18px;margin:0 12px 0 0}button,input{background:#25303a;color:var(--text);border:1px solid #41505f;border-radius:6px;padding:7px 10px}button{cursor:pointer}button:hover{border-color:var(--accent)}
main{display:grid;grid-template-columns:360px 1fr;height:calc(100vh - 58px)}aside{border-right:1px solid var(--line);padding:12px;overflow:auto;background:var(--panel)}
textarea{width:100%;height:290px;resize:vertical;background:#0f1317;color:#d9e5f1;border:1px solid #3a4652;border-radius:6px;padding:9px;font:12px Consolas,monospace}
.small{font-size:12px;color:var(--muted)}.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0}.card{background:#141a20;border:1px solid #2e3944;border-radius:6px;padding:8px}.card b{display:block;font-size:18px}
#legend{display:flex;flex-direction:column;gap:5px;margin-top:10px}.leg{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:5px;background:#151b21}.dot{width:11px;height:11px;border-radius:50%}
section{position:relative;overflow:hidden}canvas{width:100%;height:100%;display:block;background:#0b0e12}.tip{position:absolute;pointer-events:none;background:#111c;border:1px solid #52677b;padding:6px 8px;border-radius:5px;display:none;white-space:nowrap}
.row{display:flex;gap:8px;align-items:center;margin:8px 0}.row label{white-space:nowrap}.warn{color:#ffd27a}
</style>
</head>
<body>
<header>
<h1>NEU BOT v1.22 — маршруты отрядов</h1>
<button id="parseBtn">Построить из лога</button>
<button id="clearBtn">Очистить</button>
<span class="small">Поддерживает строки MOVEPOINT и MEMBERPOINT из game.log</span>
</header>
<main>
<aside>
<div class="small">Вставь сюда фрагмент <b>game.log</b> или весь лог. Визуализатор сам найдёт телеметрию v1.22.</div>
<textarea id="log" placeholder="[NEU-BOT] MOVEPOINT squad=...\n[NEU-BOT] MEMBERPOINT squad=..."></textarea>
<div class="row"><label><input type="checkbox" id="members" checked> Показать бойцов</label><label><input type="checkbox" id="labels" checked> Подписи</label></div>
<div class="stats">
<div class="card"><span class="small">Отрядов</span><b id="squadsN">0</b></div>
<div class="card"><span class="small">Точек движения</span><b id="pointsN">0</b></div>
<div class="card"><span class="small">Линий бойцов</span><b id="membersN">0</b></div>
<div class="card"><span class="small">Целей</span><b id="targetsN">0</b></div>
</div>
<div id="status" class="small warn">Вставь лог и нажми «Построить из лога».</div>
<div id="legend"></div>
</aside>
<section><canvas id="cv"></canvas><div id="tip" class="tip"></div></section>
</main>
<script>
const $=s=>document.querySelector(s), cv=$('#cv'), ctx=cv.getContext('2d');
let data={squads:new Map(),members:[],targets:new Map(),spawns:new Map(),all:[]}, view=null;
const palette=['#6db6ff','#ff9f6d','#8ce99a','#d0a8ff','#ffd66d','#72e4e4','#ff7fa8','#b6e36d','#a7b7ff','#f5a6ff'];
function tokens(line){const o={}; line.replace(/([A-Za-z][A-Za-z0-9_]*)=([^\s]+)/g,(_,k,v)=>o[k]=v); return o}
function num(v){const n=Number(v);return Number.isFinite(n)?n:null}
function addSquad(id){if(!data.squads.has(id)) data.squads.set(id,{id,pts:[],role:'?',group:'?',color:palette[data.squads.size%palette.length]}); return data.squads.get(id)}
function parse(){data={squads:new Map(),members:[],targets:new Map(),spawns:new Map(),all:[]}; const lines=$('#log').value.split(/\r?\n/);
 for(const line of lines){
  if(line.includes('MOVEPOINT ')){
   const t=tokens(line), x=num(t.x),y=num(t.y); if(x==null||y==null||!t.squad) continue;
   const s=addSquad(t.squad); s.role=t.role||s.role;s.group=t.group||s.group;
   const p={x,y,kind:t.kind||'move',phase:t.phase||'',target:t.target||'',role:t.role||'',raw:line}; s.pts.push(p);data.all.push(p);
   const tx=num(t.targetX),ty=num(t.targetY);if(tx!=null&&ty!=null&&t.target){data.targets.set(t.target,{x:tx,y:ty,name:t.target});data.all.push({x:tx,y:ty})}
   const sx=num(t.spawnX),sy=num(t.spawnY);if(sx!=null&&sy!=null){const key=t.group||'spawn';data.spawns.set(key,{x:sx,y:sy,name:'SPAWN'});data.all.push({x:sx,y:sy})}
  }
  if(line.includes('MEMBERPOINT ')){
   const t=tokens(line),sx=num(t.stageX),sy=num(t.stageY),gx=num(t.goalX),gy=num(t.goalY); if([sx,sy,gx,gy].some(v=>v==null)||!t.squad) continue;
   const m={squad:t.squad,member:t.member||'?',sx,sy,gx,gy,target:t.target||'',spacing:t.spacing||'',raw:line};data.members.push(m);data.all.push({x:sx,y:sy},{x:gx,y:gy});
   const tx=num(t.targetX),ty=num(t.targetY);if(tx!=null&&ty!=null&&t.target){data.targets.set(t.target,{x:tx,y:ty,name:t.target});data.all.push({x:tx,y:ty})}
  }
 }
 // Remove exact consecutive duplicate route points caused by order re-issue.
 for(const s of data.squads.values()){const out=[];for(const p of s.pts){const q=out[out.length-1];if(!q||Math.hypot(p.x-q.x,p.y-q.y)>.05||p.kind!==q.kind)out.push(p)}s.pts=out}
 fit(); updateUI(); draw();
}
function fit(){if(!data.all.length){view={minX:-100,maxX:100,minY:-100,maxY:100};return}let xs=data.all.map(p=>p.x),ys=data.all.map(p=>p.y);let minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);let px=Math.max(50,(maxX-minX)*.08),py=Math.max(50,(maxY-minY)*.08);view={minX:minX-px,maxX:maxX+px,minY:minY-py,maxY:maxY+py}}
function resize(){const r=cv.getBoundingClientRect(),d=devicePixelRatio||1;cv.width=Math.max(1,Math.floor(r.width*d));cv.height=Math.max(1,Math.floor(r.height*d));ctx.setTransform(d,0,0,d,0,0);draw()}
function tr(p){const r=cv.getBoundingClientRect(),w=r.width,h=r.height,dx=view.maxX-view.minX||1,dy=view.maxY-view.minY||1,s=Math.min(w/dx,h/dy)*.92,ox=(w-dx*s)/2,oy=(h-dy*s)/2;return{x:ox+(p.x-view.minX)*s,y:h-(oy+(p.y-view.minY)*s),s}}
function grid(){const r=cv.getBoundingClientRect();ctx.clearRect(0,0,r.width,r.height);if(!view)return;const span=Math.max(view.maxX-view.minX,view.maxY-view.minY),step=span>4000?500:span>2000?250:span>1000?100:span>500?50:25;ctx.font='11px Segoe UI';ctx.fillStyle='#748393';ctx.strokeStyle='#1d2730';ctx.lineWidth=1;
 for(let x=Math.floor(view.minX/step)*step;x<=view.maxX;x+=step){const a=tr({x,y:view.minY}),b=tr({x,y:view.maxY});ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.fillText(String(x),a.x+3,r.height-5)}
 for(let y=Math.floor(view.minY/step)*step;y<=view.maxY;y+=step){const a=tr({x:view.minX,y}),b=tr({x:view.maxX,y});ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.fillText(String(y),3,a.y-3)}
}
function arrow(a,b,color,width=2){const A=tr(a),B=tr(b);ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(B.x,B.y);ctx.stroke();const ang=Math.atan2(B.y-A.y,B.x-A.x),l=7;ctx.beginPath();ctx.moveTo(B.x,B.y);ctx.lineTo(B.x-Math.cos(ang-.5)*l,B.y-Math.sin(ang-.5)*l);ctx.lineTo(B.x-Math.cos(ang+.5)*l,B.y-Math.sin(ang+.5)*l);ctx.closePath();ctx.fill()}
function mark(p,color,label,shape='circle'){const P=tr(p);ctx.fillStyle=color;ctx.strokeStyle='#071018';ctx.lineWidth=1.5;ctx.beginPath();if(shape==='square')ctx.rect(P.x-5,P.y-5,10,10);else{ctx.arc(P.x,P.y,5,0,Math.PI*2)}ctx.fill();ctx.stroke();if($('#labels').checked&&label){ctx.font='12px Segoe UI';ctx.fillStyle='#e9f1f8';ctx.fillText(label,P.x+8,P.y-7)}}
function draw(){grid();if(!view)return;
 for(const p of data.spawns.values()) mark(p,'#ffffff','SPAWN','square');
 for(const p of data.targets.values()) mark(p,'#ff6969',p.name,'square');
 for(const s of data.squads.values()){
  for(let i=1;i<s.pts.length;i++)arrow(s.pts[i-1],s.pts[i],s.color,2.4);
  s.pts.forEach((p,i)=>mark(p,s.color,`S${s.id} ${p.kind}`));
 }
 if($('#members').checked){for(const m of data.members){const s=data.squads.get(m.squad),c=s?s.color:'#e5e5e5';arrow({x:m.sx,y:m.sy},{x:m.gx,y:m.gy},c,1);mark({x:m.sx,y:m.sy},c,`S${m.squad}.${m.member}`);}}
}
function updateUI(){$('#squadsN').textContent=data.squads.size;$('#pointsN').textContent=[...data.squads.values()].reduce((a,s)=>a+s.pts.length,0);$('#membersN').textContent=data.members.length;$('#targetsN').textContent=data.targets.size;$('#status').textContent=data.squads.size?`Найдено ${data.squads.size} отрядов. Линии строятся по фактическим точкам, которые v1.22 записал в лог.`:'Строк MOVEPOINT не найдено. Нужен лог от обновлённой v1.22.';
 const l=$('#legend');l.innerHTML='';for(const s of data.squads.values()){const e=document.createElement('div');e.className='leg';e.innerHTML=`<span class="dot" style="background:${s.color}"></span><b>Squad ${s.id}</b><span class="small">G${s.group} · ${s.role} · ${s.pts.length} точек</span>`;l.appendChild(e)}}
$('#parseBtn').onclick=parse;$('#clearBtn').onclick=()=>{$('#log').value='';parse()};$('#members').onchange=draw;$('#labels').onchange=draw;window.addEventListener('resize',resize);new ResizeObserver(resize).observe(cv.parentElement);fit();resize();
</script>
</body>
</html>
