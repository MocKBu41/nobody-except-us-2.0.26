<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>NEU BOT GPT — Live Visualizer</title>
<style>
:root{color-scheme:dark;--bg:#0c1117;--panel:#111923;--line:#263445;--text:#e8edf3;--muted:#8ea1b5;--bot:#45a3ff;--enemy:#ff5d64;--neutral:#d7a443;--good:#50d890;--warn:#ffb454}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 Segoe UI,Arial,sans-serif;overflow:hidden}
#app{height:100vh;display:grid;grid-template-rows:54px 1fr 210px}.top{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#0f1620;border-bottom:1px solid var(--line)}
button{background:#1d2a38;color:var(--text);border:1px solid #33465c;border-radius:7px;padding:8px 12px;cursor:pointer}button:hover{background:#26384b}.pill{padding:5px 9px;border:1px solid var(--line);border-radius:999px;color:var(--muted)}.live{color:var(--good)}
.main{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 330px}.mapWrap{position:relative;min-width:0;background:radial-gradient(circle at center,#121d29,#091018 75%)}canvas{width:100%;height:100%;display:block}.hint{position:absolute;left:12px;bottom:12px;background:#0b121bd9;border:1px solid var(--line);border-radius:7px;padding:8px 10px;color:var(--muted)}
.side{overflow:auto;border-left:1px solid var(--line);background:var(--panel);padding:10px}.card{border:1px solid var(--line);background:#0d151e;border-radius:8px;padding:10px;margin-bottom:9px}.card h3{font-size:13px;margin:0 0 8px}.kv{display:grid;grid-template-columns:1fr auto;gap:4px 10px;color:var(--muted)}.kv b{color:var(--text)}
.group{border-left:3px solid var(--bot)}.phase{font-weight:700}.phase.attack{color:#ff8b8f}.phase.approach{color:#ffd37a}.phase.assembling{color:#8cc6ff}.phase.ready{color:#84e1a8}
.log{min-height:0;border-top:1px solid var(--line);background:#090e14;display:grid;grid-template-rows:34px 1fr}.logHead{padding:7px 12px;color:var(--muted);border-bottom:1px solid #1b2734}.logBody{overflow:auto;padding:6px 12px;font:12px/1.45 Consolas,monospace}.row{white-space:pre-wrap}.row .t{color:#68829b}.row.order{color:#9fd1ff}.row.spawn{color:#9fe8be}.row.loss,.row.warning{color:#ff9da1}.row.decision{color:#ffd17b}.row.capture{color:#6fe3a4}.empty{color:var(--muted);padding:20px}
.legend{display:flex;gap:12px;margin-left:auto}.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:5px}.bot{background:var(--bot)}.enemy{background:var(--enemy)}.neutral{background:var(--neutral)}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <button id="pick">Подключить телеметрию</button>
    <button id="pause">Пауза</button>
    <span id="status" class="pill">файл не выбран</span>
    <span id="clock" class="pill">00:00</span>
    <span id="mapName" class="pill">карта: —</span>
    <div class="legend"><span><i class="dot bot"></i>бот</span><span><i class="dot enemy"></i>враг</span><span><i class="dot neutral"></i>нейтр.</span></div>
  </div>
  <div class="main">
    <div class="mapWrap"><canvas id="map"></canvas><div class="hint">Линии: сбор → подход → цель. Маркер G# показывает текущий логический этап группы.</div></div>
    <aside class="side">
      <div id="summary" class="card"><h3>Состояние бота</h3><div class="empty">Нет данных</div></div>
      <div id="groups"></div>
    </aside>
  </div>
  <div class="log"><div class="logHead">Журнал решений</div><div id="log" class="logBody"></div></div>
</div>
<script>
const $=s=>document.querySelector(s), canvas=$('#map'), ctx=canvas.getContext('2d');
let handle=null, paused=false, lastText='', latest=null, events=[];
function fmtTime(s){s=Math.max(0,Math.floor(+s||0));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function resize(){const r=canvas.getBoundingClientRect();const d=devicePixelRatio||1;canvas.width=Math.max(1,r.width*d);canvas.height=Math.max(1,r.height*d);ctx.setTransform(d,0,0,d,0,0);draw()}
addEventListener('resize',resize);
function parse(text){if(text===lastText)return;lastText=text;let snap=null, ev=[];for(const line of text.split(/\r?\n/)){if(!line.trim())continue;try{const x=JSON.parse(line);if(x.type==='snapshot')snap=x;else if(x.type==='event')ev.push(x)}catch{}}if(snap)latest=snap;events=ev.slice(-400);render()}
async function read(){if(paused||!handle)return;try{const f=await handle.getFile();parse(await f.text());$('#status').textContent='LIVE • '+f.name;$('#status').classList.add('live')}catch(e){$('#status').textContent='ошибка чтения файла'}}
$('#pick').onclick=async()=>{if(!window.showOpenFilePicker){alert('Нужен Chrome/Edge с File System Access API.');return}const [h]=await showOpenFilePicker({types:[{description:'BOT telemetry JSONL',accept:{'application/json':['.jsonl','.log','.txt']}}]});handle=h;lastText='';await read()};
$('#pause').onclick=()=>{paused=!paused;$('#pause').textContent=paused?'Продолжить':'Пауза';if(!paused)read()};
setInterval(read,500);
function bounds(s){const pts=[];(s.flags||[]).forEach(p=>Number.isFinite(p.x)&&Number.isFinite(p.y)&&pts.push(p));if(s.spawn&&Number.isFinite(s.spawn.x))pts.push(s.spawn);if(!pts.length)return {minX:-1,maxX:1,minY:-1,maxY:1};let minX=Math.min(...pts.map(p=>p.x)),maxX=Math.max(...pts.map(p=>p.x)),minY=Math.min(...pts.map(p=>p.y)),maxY=Math.max(...pts.map(p=>p.y));const px=(maxX-minX||1)*.08,py=(maxY-minY||1)*.08;return {minX:minX-px,maxX:maxX+px,minY:minY-py,maxY:maxY+py}}
function project(p,b,w,h){return {x:(p.x-b.minX)/(b.maxX-b.minX)*w,y:h-(p.y-b.minY)/(b.maxY-b.minY)*h}}
function line(a,b,bnd,w,h,color,dash=[]){if(!a||!b)return;const A=project(a,bnd,w,h),B=project(b,bnd,w,h);ctx.save();ctx.strokeStyle=color;ctx.lineWidth=2;ctx.setLineDash(dash);ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(B.x,B.y);ctx.stroke();ctx.restore()}
function draw(){const r=canvas.getBoundingClientRect(),w=r.width,h=r.height;ctx.clearRect(0,0,w,h);if(!latest){ctx.fillStyle='#71869a';ctx.font='15px Segoe UI';ctx.fillText('Подключите bot_gpt_telemetry.jsonl',24,34);return}const b=bounds(latest);
ctx.save();ctx.strokeStyle='#162331';ctx.lineWidth=1;for(let x=0;x<w;x+=80){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}for(let y=0;y<h;y+=80){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}ctx.restore();
for(const g of latest.groups||[]){line(g.rally,g.approach,b,w,h,'#55718e',[6,5]);line(g.approach,g.destination||g.tankApproach,b,w,h,'#6f9bc4',[6,5]);const target=(latest.flags||[]).find(f=>f.name===g.target);line(g.destination,target,b,w,h,'#45a3ff',[])}
for(const f of latest.flags||[]){if(!Number.isFinite(f.x)||!Number.isFinite(f.y))continue;const p=project(f,b,w,h);ctx.beginPath();ctx.arc(p.x,p.y,9,0,Math.PI*2);ctx.fillStyle=f.owner==='bot'?'#45a3ff':f.owner==='enemy'?'#ff5d64':'#d7a443';ctx.fill();ctx.strokeStyle='#e8edf3';ctx.lineWidth=1.5;ctx.stroke();ctx.fillStyle='#e8edf3';ctx.font='12px Segoe UI';ctx.fillText(f.name,p.x+12,p.y+4)}
if(latest.spawn&&Number.isFinite(latest.spawn.x)){const p=project(latest.spawn,b,w,h);ctx.strokeStyle='#50d890';ctx.strokeRect(p.x-8,p.y-8,16,16);ctx.fillStyle='#8ceeb6';ctx.fillText('SPAWN',p.x+12,p.y+4)}
for(const g of latest.groups||[]){const pos=g.destination||g.approach||g.rally||((latest.flags||[]).find(f=>f.name===g.target));if(!pos||!Number.isFinite(pos.x))continue;const p=project(pos,b,w,h);ctx.fillStyle='#07131f';ctx.strokeStyle='#a7d4ff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,p.y,14,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#fff';ctx.font='bold 11px Segoe UI';ctx.textAlign='center';ctx.fillText('G'+g.id,p.x,p.y+4);ctx.textAlign='left'} }
function render(){if(!latest){draw();return}$('#clock').textContent=fmtTime(latest.time);$('#mapName').textContent='карта: '+(latest.map||'—');$('#summary').innerHTML=`<h3>Состояние бота</h3><div class="kv"><span>Точки бота</span><b>${latest.flagsMine??0}</b><span>Точки врага</span><b>${latest.flagsEnemy??0}</b><span>Нейтральные</span><b>${latest.flagsNeutral??0}</b><span>Атака разрешена</span><b>${latest.attackUnlocked?'ДА':'НЕТ'}</b><span>Нейтрали очищены</span><b>${latest.neutralsCleared?'ДА':'НЕТ'}</b><span>Авиа КД</span><b>${Math.ceil(latest.airCooldownRemaining||0)} c</b></div>`;
$('#groups').innerHTML=(latest.groups||[]).sort((a,b)=>a.id-b.id).map(g=>`<div class="card group"><h3>Группа G${g.id}</h3><div class="kv"><span>Фаза</span><b class="phase ${g.phase}">${g.phase}</b><span>Цель</span><b>${g.target||'—'}</b><span>Волна</span><b>${g.wave||0}</b><span>Пехота</span><b>${g.infantryCount||0}</b><span>Танки</span><b>${g.tankCount||0}</b><span>Сбор</span><b>${g.rally?.name||'—'}</b><span>Подход</span><b>${g.approach?.name||'—'}</b><span>Ошибки волн</span><b>${g.failCount||0}</b></div></div>`).join('')||'<div class="empty">Групп пока нет</div>';
$('#log').innerHTML=events.slice(-180).reverse().map(e=>`<div class="row ${e.kind||''}"><span class="t">[${fmtTime(e.time)}]</span> ${escapeHtml(e.message||'')}</div>`).join('');draw()}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
resize();
</script>
</body>
</html>
